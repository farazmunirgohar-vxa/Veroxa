name: VER39 P2 regression staging

on:
  push:
    branches:
      - agent/ver39-p2-regression-staging-20260821

permissions:
  contents: write

jobs:
  patch-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ver39-p2-regression-staging-20260821
          fetch-depth: 0
      - name: Add exact-path regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("artifacts/veroxa-sites/tests/momo-upload-ready-contract.test.mjs")
          text = path.read_text(encoding="utf-8")

          old_imports = '''import assert from "node:assert/strict";
          import test from "node:test";
          import { readFile } from "node:fs/promises";
          '''
          new_imports = '''import assert from "node:assert/strict";
          import test from "node:test";
          import { execFileSync } from "node:child_process";
          import { mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { readFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          '''
          if text.count(old_imports) != 1:
              raise SystemExit(f"expected imports once, found {text.count(old_imports)}")
          text = text.replace(old_imports, new_imports)

          old_read = '''const contentLifecycleEdge = await readFile(new URL("../supabase/functions/momo-content-ai-lifecycle/index.ts", import.meta.url), "utf8");
          '''
          new_read = '''const contentLifecycleEdge = await readFile(new URL("../supabase/functions/momo-content-ai-lifecycle/index.ts", import.meta.url), "utf8");
          const releaseManifest = await readFile(new URL("../../../scripts/src/release-manifest.ts", import.meta.url), "utf8");
          '''
          if text.count(old_read) != 1:
              raise SystemExit(f"expected lifecycle read once, found {text.count(old_read)}")
          text = text.replace(old_read, new_read)

          marker = '''test("USD100 authority, indexes, and Momo-only publication guards are asserted", () => {
          '''
          regression = r'''test("release scope preserves whitespace-lookalike Git paths exactly", () => {
            const helper = releaseManifest.match(/function gitPathList\(args: string\[\]\): string\[\] \{[\s\S]*?\n\}/u)?.[0] ?? "";
            assert.match(helper, /const \[command, \.\.\.commandArgs\] = args;/u);
            assert.match(helper, /execFileSync\("git", \[command, "-z", \.\.\.commandArgs\]/u);
            assert.match(helper, /output\.split\("\\0"\)\.filter\(\(path\) => path\.length > 0\)/u);
            assert.doesNotMatch(helper, /\.trim\(\)/u);

            const root = mkdtempSync(join(tmpdir(), "veroxa-git-path-"));
            try {
              writeFileSync(join(root, "allowed "), "x", "utf8");
              execFileSync("git", ["init", "-q"], { cwd: root });
              execFileSync("git", ["add", "--", "allowed "], { cwd: root });
              const output = execFileSync("git", ["diff", "--cached", "--name-only", "-z", "--"], {
                cwd: root,
                encoding: "utf8",
              });
              const paths = output.split("\0").filter((path) => path.length > 0);
              assert.deepEqual(paths, ["allowed "]);
              assert.notEqual(paths[0], "allowed");
            } finally {
              rmSync(root, { recursive: true, force: true });
            }
          });

          '''
          if text.count(marker) != 1:
              raise SystemExit(f"expected insertion marker once, found {text.count(marker)}")
          text = text.replace(marker, regression + marker)
          path.write_text(text, encoding="utf-8")
      - name: Verify narrow regression patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "artifacts/veroxa-sites/tests/momo-upload-ready-contract.test.mjs"
          node --test artifacts/veroxa-sites/tests/momo-upload-ready-contract.test.mjs
      - name: Commit regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "veroxa-r3-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/veroxa-sites/tests/momo-upload-ready-contract.test.mjs
          git commit -m "test(release): reject whitespace-lookalike paths"
          git push origin HEAD:agent/ver39-p2-regression-staging-20260821
