name: VER-39 Whitespace-Safe Guard Patch

on:
  push:
    branches:
      - agent/ver-39-edge-jwt-gate-repair-20260820
    paths:
      - .github/workflows/ver39-whitespace-guard-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact whitespace-safe Git path parser repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a5cca7f47067de82db9d1471090d283b4d321bb5"
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/src/release-manifest.ts')
          s = p.read_text()
          start_marker = 'function gitPathList(args: string[]): string[] {'
          start = s.index(start_marker)
          end = s.index('\n}\n', start) + 2
          old = s[start:end]
          assert 'execFileSync("git", args' in old
          assert '.trim()' in old
          new = '''function gitPathList(args: string[]): string[] {
  if (args.length === 0) return [];
  const output = execFileSync("git", [args[0], "-z", ...args.slice(1)], {
    cwd: repoRoot,
    encoding: "utf8",
  });
  return output.split("\\0").filter((path) => path.length > 0);
}'''
          s = s[:start] + new + s[end:]
          assert s.count('function gitPathList(args: string[]): string[] {') == 1
          assert 'return output.split("\\0").filter((path) => path.length > 0);' in s
          p.write_text(s)
          PY
          rm .github/workflows/ver39-whitespace-guard-patch.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/ver39-whitespace-guard-patch.yml\nscripts/src/release-manifest.ts'
      - name: Prove trailing-whitespace path remains rejected
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/scripts run check-deployment-manifest
          touch 'supabase/config.toml '
          set +e
          output="$(pnpm --filter @workspace/scripts run check-deployment-manifest 2>&1)"
          status=$?
          set -e
          rm 'supabase/config.toml '
          if [ "$status" -eq 0 ]; then
            echo 'whitespace-collision probe unexpectedly passed' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'pre-intervention candidate Git scope drifted'
          pnpm --filter @workspace/scripts run check-deployment-manifest
      - name: Commit exact repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): preserve exact Git path bytes'
          git push origin HEAD:agent/ver-39-edge-jwt-gate-repair-20260820
