name: VER-39 Exact Scope Patch

on:
  push:
    branches:
      - agent/ver-39-edge-jwt-gate-repair-20260820
    paths:
      - .github/workflows/ver39-scope-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify parent and apply exact fail-closed scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "731022d68407f1390a0ce3137f470d29b8df3d56"
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/src/release-manifest.ts')
          s = p.read_text()
          marker = 'const ACTIVE_PREINTERVENTION_ACCEPTANCE_CANDIDATE_ALLOWED_PATHS = new Set([\n'
          assert s.count(marker) == 1
          additions = (
              '  "artifacts/veroxa-sites/supabase/config.toml",\n'
              '  "artifacts/veroxa-sites/tests/momo-content-ai-lifecycle-auth-config.test.mjs",\n'
              '  "artifacts/veroxa-sites/tests/momo-upload-ready-contract.test.mjs",\n'
              '  "supabase/config.toml",\n'
          )
          for line in additions.splitlines():
              assert line not in s
          s = s.replace(marker, marker + additions, 1)
          for line in additions.splitlines():
              assert s.count(line) == 1
          p.write_text(s)
          PY
          rm .github/workflows/ver39-scope-patch.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/ver39-scope-patch.yml\nscripts/src/release-manifest.ts'
      - name: Commit exact patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): admit exact VER-39 repair scope'
          git push origin HEAD:agent/ver-39-edge-jwt-gate-repair-20260820
