name: VER-39 Exact Scope Patch

on:
  push:
    branches:
      - agent/ver-39-edge-jwt-gate-repair-20260820
    paths:
      - .github/workflows/ver39-scope-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Preserve exact Git path bytes and self-remove helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cfc9fb1d2d8cb1b6db9d4d95f49aa06859270696"
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/src/release-manifest.ts')
          s = p.read_text()
          start = s.index('function gitPathList(args: string[]): string[] {')
          end = s.index('\n}\n', start) + 2
          old = s[start:end]
          assert 'execFileSync("git", args' in old
          assert '.trim()' in old
          new = '''function gitPathList(args: string[]): string[] {
  if (args.length === 0) return [];
  const output = execFileSync("git", [args[0], "-z", ...args.slice(1)], {
    cwd: repoRoot,
    encoding: "utf8",
  });
  return output.split("\\0").filter((path) => path.length > 0);
}'''
          p.write_text(s[:start] + new + s[end:])
          PY
          rm -f .github/workflows/ver39-whitespace-guard-patch.yml
          rm -f .github/workflows/ver39-exact-path-bytes-patch.yml
          rm -f .github/workflows/ver39-scope-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): preserve exact Git path bytes'
          git push origin HEAD:agent/ver-39-edge-jwt-gate-repair-20260820
