name: VER39 P2 staging patch

on:
  push:
    branches:
      - agent/ver39-p2-nul-path-staging-20260821

permissions:
  contents: write

jobs:
  patch-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ver39-p2-nul-path-staging-20260821
          fetch-depth: 0
      - name: Apply exact NUL-delimited path fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/src/release-manifest.ts")
          text = path.read_text(encoding="utf-8")
          old = r'''function gitPathList(args: string[]): string[] {
            const output = execFileSync("git", args, {
              cwd: repoRoot,
              encoding: "utf8",
            });
            return output.split("\n").map((path) => path.trim()).filter(Boolean);
          }'''
          new = r'''function gitPathList(args: string[]): string[] {
            const [command, ...commandArgs] = args;
            if (!command) return [];
            const output = execFileSync("git", [command, "-z", ...commandArgs], {
              cwd: repoRoot,
              encoding: "utf8",
            });
            return output.split("\0").filter((path) => path.length > 0);
          }'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one helper match, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Verify narrow patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- scripts/src/release-manifest.ts
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "scripts/src/release-manifest.ts"
      - name: Commit staging fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/src/release-manifest.ts; then
            echo "No patch to commit"
            exit 1
          fi
          git config user.name "veroxa-r3-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/src/release-manifest.ts
          git commit -m "fix(release): preserve exact git paths"
          git push origin HEAD:agent/ver39-p2-nul-path-staging-20260821
